
name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    name: Lint, Test, Train and Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify environment
        run: python -m src.check_environment

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Download UCI dataset
        run: |
          python -m src.data.download

      - name: Validate dataset
        run: |
          python -m src.data.validate

      - name: Train models with MLflow
        run: |
          python -m src.models.train

      - name: Verify saved model inference
        run: |
          python -m src.models.check_inference

      - name: Build Docker image
        run: |
          docker build -t heart-disease-api:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name heart-disease-api-test \
            -p 8000:8000 \
            heart-disease-api:ci

      - name: Test container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs heart-disease-api-test
          exit 1

      - name: Test container prediction
        run: |
          python - <<'PY'
          import json
          import urllib.request

          patient = {
              "age": 55,
              "sex": 1,
              "cp": 2,
              "trestbps": 140,
              "chol": 250,
              "fbs": 0,
              "restecg": 1,
              "thalach": 150,
              "exang": 0,
              "oldpeak": 1.2,
              "slope": 2,
              "ca": 0,
              "thal": 3,
          }

          request = urllib.request.Request(
              "http://localhost:8000/predict",
              data=json.dumps(patient).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 200
              result = json.load(response)

          assert result["prediction"] in (0, 1)
          assert 0 <= result["probability"] <= 1
          assert 0 <= result["confidence"] <= 1

          print("Container prediction test passed:", result)
          PY

      - name: Show Docker logs
        if: always()
        run: |
          docker logs heart-disease-api-test || true

      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f heart-disease-api-test || true

      - name: Save tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save heart-disease-api:ci \
            -o /tmp/heart-disease-image.tar

      - name: Upload tested Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-docker-image
          path: /tmp/heart-disease-image.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model
          path: |
            models/heart_disease_pipeline.joblib
            models/model_metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload evaluation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: reports/model_evaluation/
          if-no-files-found: error
          retention-days: 14

      - name: Upload MLflow tracking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlruns/
            mlartifacts/
          if-no-files-found: warn
          retention-days: 14


  publish-image:
    name: Publish Tested Image to GHCR
    needs: validate-and-train
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.reference }}

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: tested-docker-image
          path: /tmp/docker-image

      - name: Load tested image
        run: |
          docker load -i /tmp/docker-image/heart-disease-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          REPO_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}:${COMMIT_SHA}"

          docker tag heart-disease-api:ci "$IMAGE"
          docker push "$IMAGE"

          echo "reference=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published: $IMAGE"


  kubernetes-deployment-test:
    name: Automated Kubernetes Deployment Test
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: heart-disease-ci

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl cluster-info


      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load published image into Kubernetes
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" \
            --name heart-disease-ci

      - name: Deploy application
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          bash scripts/deploy_kubernetes.sh "$IMAGE"

      - name: Verify two ready replicas
        run: |
          kubectl wait \
            --for=condition=available \
            deployment/heart-disease-api \
            --timeout=180s

          READY=$(kubectl get deployment heart-disease-api \
            -o jsonpath='{.status.readyReplicas}')

          test "$READY" = "2"

      - name: Start Kubernetes port forwarding
        run: |
          kubectl port-forward \
            service/heart-disease-service \
            8080:80 > /tmp/port-forward.log 2>&1 &

      - name: Verify deployed API
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "http://127.0.0.1:8080"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                      base + "/health", timeout=5
                  ) as response:
                      health = json.load(response)

                  if health["model_loaded"]:
                      break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError("Kubernetes API not healthy")

          patient = {
              "age": 55,
              "sex": 1,
              "cp": 2,
              "trestbps": 140,
              "chol": 250,
              "fbs": 0,
              "restecg": 1,
              "thalach": 150,
              "exang": 0,
              "oldpeak": 1.2,
              "slope": 2,
              "ca": 0,
              "thal": 3,
          }

          request = urllib.request.Request(
              base + "/predict",
              data=json.dumps(patient).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              result = json.load(response)

          assert result["prediction"] in (0, 1)
          assert 0 <= result["probability"] <= 1
          assert 0 <= result["confidence"] <= 1

          print("Kubernetes deployment test passed")
          print(result)
          PY

      - name: Capture Kubernetes evidence
        if: always()
        run: |
          mkdir -p deployment-evidence

          kubectl get nodes -o wide \
            > deployment-evidence/nodes.txt || true

          kubectl get pods -o wide \
            > deployment-evidence/pods.txt || true

          kubectl get deployments \
            > deployment-evidence/deployments.txt || true

          kubectl get services \
            > deployment-evidence/services.txt || true

          kubectl describe deployment heart-disease-api \
            > deployment-evidence/deployment-details.txt || true

          kubectl logs deployment/heart-disease-api \
            --tail=100 \
            > deployment-evidence/api-logs.txt || true

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-deployment-evidence
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 14
