
name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    name: Lint, Test, Train and Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify environment
        run: python -m src.check_environment

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Download UCI dataset
        run: |
          python -m src.data.download

      - name: Validate dataset
        run: |
          python -m src.data.validate

      - name: Train models with MLflow
        run: |
          python -m src.models.train

      - name: Verify saved model inference
        run: |
          python -m src.models.check_inference

      - name: Build Docker image
        run: |
          docker build -t heart-disease-api:ci .

      - name: Start Docker container
        run: |
          docker run -d \
            --name heart-disease-api-test \
            -p 8000:8000 \
            heart-disease-api:ci

      - name: Test container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Container health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs heart-disease-api-test
          exit 1

      - name: Test container prediction
        run: |
          python - <<'PY'
          import json
          import urllib.request

          patient = {
              "age": 55,
              "sex": 1,
              "cp": 2,
              "trestbps": 140,
              "chol": 250,
              "fbs": 0,
              "restecg": 1,
              "thalach": 150,
              "exang": 0,
              "oldpeak": 1.2,
              "slope": 2,
              "ca": 0,
              "thal": 3,
          }

          request = urllib.request.Request(
              "http://localhost:8000/predict",
              data=json.dumps(patient).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 200
              result = json.load(response)

          assert result["prediction"] in (0, 1)
          assert 0 <= result["probability"] <= 1
          assert 0 <= result["confidence"] <= 1

          print("Container prediction test passed:", result)
          PY

      - name: Show Docker logs
        if: always()
        run: |
          docker logs heart-disease-api-test || true

      - name: Stop Docker container
        if: always()
        run: |
          docker rm -f heart-disease-api-test || true

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model
          path: |
            models/heart_disease_pipeline.joblib
            models/model_metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload evaluation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: reports/model_evaluation/
          if-no-files-found: error
          retention-days: 14

      - name: Upload MLflow tracking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlruns/
            mlartifacts/
          if-no-files-found: warn
          retention-days: 14
