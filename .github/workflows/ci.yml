
name: Heart Disease MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-train:
    name: Lint, Test, Train and Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Verify environment
        run: python -m src.check_environment

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Download UCI dataset
        run: |
          python -m src.data.download

      - name: Validate dataset
        run: |
          python -m src.data.validate

      - name: Train models with MLflow
        run: |
          python -m src.models.train

      - name: Verify saved model inference
        run: |
          python -m src.models.check_inference

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model
          path: |
            models/heart_disease_pipeline.joblib
            models/model_metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload evaluation artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: reports/model_evaluation/
          if-no-files-found: error
          retention-days: 14

      - name: Upload MLflow tracking evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlruns/
            mlartifacts/
          if-no-files-found: warn
          retention-days: 14
